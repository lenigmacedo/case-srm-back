name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: lint → typecheck → test → build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn eslint "{src,apps,libs,test}/**/*.ts"

      - name: Typecheck
        run: yarn tsc --noEmit

      - name: Unit tests
        run: yarn test --passWithNoTests --forceExit

      - name: Build
        run: yarn build
